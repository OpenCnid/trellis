name: CI

on:
  push:
    branches: [master]
    # Docs-only changes skip CI entirely. Everything listed is provably inert:
    # nothing under these paths is read by any test, the tsc build, or the
    # Docker image. docs/product/** is deliberately NOT listed — the
    # engineering-loop tests read docs/product/engineering-loop/*.json — and
    # neither are tools/engineering-loop/prompts/** or SPEC.md, whose digests
    # the prompt_compiler tests pin.
    # These checks are not required in branch protection today. If that ever
    # changes, move this filtering down to job level (e.g. dorny/paths-filter):
    # a workflow skipped by path filters leaves a required check Pending
    # forever and blocks the merge, whereas a skipped job reports success.
    paths-ignore:
      - '*.md'
      - '.claude/**'
      - 'docs/*.md'
      - 'docs/architecture/**'
      - 'docs/archive/**'
      - 'docs/benchmarks/**'
      - 'docs/operations/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'
      - '.claude/**'
      - 'docs/*.md'
      - 'docs/architecture/**'
      - 'docs/archive/**'
      - 'docs/benchmarks/**'
      - 'docs/operations/**'

permissions:
  contents: read

# A superseded push to the same pull request cancels the in-flight run;
# master runs are never cancelled, so every master commit keeps a complete
# CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # redis-memory-server is a PoC-only dependency (scripts/pocs/) that no
      # test imports; its postinstall downloads Redis source and compiles it
      # with make — formerly ~3.5 minutes of every npm ci here. The Dockerfile
      # already skips it via --ignore-scripts; this is the workflow-side
      # equivalent, scoped so the other install scripts still run.
      REDISMS_DISABLE_POSTINSTALL: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      # npm test needs a bare interpreter on PATH (block_parity, scaffold, and
      # parse_gate spawn real Python) but none of the pip runtime, so it runs
      # before the install.
      - run: npm test
      - run: npm run build
      - name: Install Python runtime
        run: |
          python -m pip install --requirement requirements.txt --requirement requirements-pdf-fast.txt
          python -m pip install --no-deps --requirement requirements-pdf-fast-nodeps.txt
      - run: npm run python:check
      # The editing toolkit's live zero-LLM drill: needs the Python
      # runtime installed above, no database or network (coverage
      # audit gap #7 — the drill was previously not regression-detected).
      - run: npm run test:textedit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: trellis-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TRELLIS_IMAGE: trellis-backend:ci-${{ github.run_id }}-${{ github.run_attempt }}
      TRELLIS_POSTGRES_HOST_PORT: "0"
      TRELLIS_NEO4J_HTTP_HOST_PORT: "0"
      TRELLIS_NEO4J_BOLT_HOST_PORT: "0"
      TRELLIS_REDIS_HOST_PORT: "0"
      TRELLIS_API_HOST_PORT: "0"
      API_KEY: trellis-ci-integration-key
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      # One layer-cached build, loaded into this runner's daemon under the
      # exact tag the Compose file consumes (all four app services share it).
      # `compose up` below therefore runs WITHOUT --build and reuses this
      # image. The previous standalone image job loaded its build into a
      # runner nobody else could see — jobs are isolated — under a tag no
      # other job referenced, so integration rebuilt from scratch every run.
      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.TRELLIS_IMAGE }}
          cache-from: type=gha,scope=trellis-backend
          cache-to: type=gha,scope=trellis-backend,mode=max
      - name: Validate Compose model
        run: docker compose --profile test config --quiet
      - name: Run zero-LLM round trip
        run: docker compose --profile test up --abort-on-container-exit --exit-code-from integration integration
      - name: Show Compose logs
        if: always()
        run: docker compose --profile test logs --no-color
      - name: Remove isolated project and volumes
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
