<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 662" width="1000" height="662" role="img" aria-label="Trellis REPL isolation architecture. The rlms REPL worker (model-authored Python) runs inside a Kata microVM with an optional gVisor Systrap layer; it holds no database credentials. vsock is the only channel out of the guest, carrying llm_query to the host LM handler and DB RPC to a trusted host broker that holds the Neo4j and Postgres credentials and enforces a statement-level denylist. All other egress is denied by default at the host or VMM NIC.">
  <style>
    :root{
      --s-paper:#eef2f4; --s-panel:#f7f9fa; --s-ink:#1a2830; --s-soft:#5c6d77;
      --s-host-fill:#e7efec; --s-host-line:#3a936a;
      --s-vm-fill:#f8efdd; --s-vm-line:#c0842a;
      --s-gv-line:#7c8ea3; --s-worker-fill:#ffffff; --s-worker-line:#3f5c69;
      --s-svc-fill:#e6f1ec; --s-broker-fill:#dcece2; --s-svc-line:#3a936a;
      --s-db-fill:#f2f5f6; --s-accent:#0f8fa1; --s-danger:#c8482f;
    }
    @media (prefers-color-scheme:dark){:root{
      --s-paper:#0d151d; --s-panel:#131f28; --s-ink:#dce6ec; --s-soft:#8ca0ac;
      --s-host-fill:#122019; --s-host-line:#4bab7d;
      --s-vm-fill:#231a0d; --s-vm-line:#cf9a3f;
      --s-gv-line:#6d8098; --s-worker-fill:#0f1a22; --s-worker-line:#5f7d8b;
      --s-svc-fill:#12231c; --s-broker-fill:#132a20; --s-svc-line:#4bab7d;
      --s-db-fill:#111d25; --s-accent:#2bbccf; --s-danger:#e06a54;
    }}
    :root[data-theme="light"]{
      --s-paper:#eef2f4; --s-panel:#f7f9fa; --s-ink:#1a2830; --s-soft:#5c6d77;
      --s-host-fill:#e7efec; --s-host-line:#3a936a; --s-vm-fill:#f8efdd; --s-vm-line:#c0842a;
      --s-gv-line:#7c8ea3; --s-worker-fill:#ffffff; --s-worker-line:#3f5c69;
      --s-svc-fill:#e6f1ec; --s-broker-fill:#dcece2; --s-svc-line:#3a936a;
      --s-db-fill:#f2f5f6; --s-accent:#0f8fa1; --s-danger:#c8482f;
    }
    :root[data-theme="dark"]{
      --s-paper:#0d151d; --s-panel:#131f28; --s-ink:#dce6ec; --s-soft:#8ca0ac;
      --s-host-fill:#122019; --s-host-line:#4bab7d; --s-vm-fill:#231a0d; --s-vm-line:#cf9a3f;
      --s-gv-line:#6d8098; --s-worker-fill:#0f1a22; --s-worker-line:#5f7d8b;
      --s-svc-fill:#12231c; --s-broker-fill:#132a20; --s-svc-line:#4bab7d;
      --s-db-fill:#111d25; --s-accent:#2bbccf; --s-danger:#e06a54;
    }
    .s-txt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:var(--s-ink)}
    .s-mono{font-family:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;fill:var(--s-ink)}
    .s-title{font-size:15px;font-weight:700;letter-spacing:.14em}
    .s-sub{font-size:11.5px;fill:var(--s-soft)}
    .s-zone{font-size:11px;font-weight:700;letter-spacing:.15em}
    .s-strong{font-size:14px;font-weight:700}
    .s-strongsm{font-size:12.5px;font-weight:700}
    .s-small{font-size:10.5px;fill:var(--s-soft)}
    .s-line{font-size:11.5px}
    .s-ok{font-size:11px;font-weight:600;fill:var(--s-host-line)}
    .s-chanlbl{font-size:10.5px;font-weight:600;fill:var(--s-accent)}
    .s-gate{font-size:10px;font-weight:700;letter-spacing:.16em;fill:var(--s-accent)}
    .s-danger{font-size:10.5px;font-weight:600;fill:var(--s-danger)}
    .s-creds{font-size:10px;font-weight:600;fill:var(--s-host-line)}
    .s-leg{font-size:10.5px;fill:var(--s-soft)}
  </style>
  <defs>
    <marker id="ah-accent" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--s-accent)"/></marker>
    <marker id="ah-danger" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--s-danger)"/></marker>
    <marker id="ah-creds" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--s-host-line)"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="662" fill="var(--s-paper)"/>
  <text class="s-txt s-title" x="24" y="30">TRELLIS REPL &#183; ISOLATION ARCHITECTURE</text>
  <text class="s-txt s-sub" x="24" y="50">Hybrid boundary &#8212; the whole worker runs inside a Kata microVM; database credentials are brokered on the host; vsock is the only channel out.</text>

  <!-- HOST trusted zone -->
  <rect class="s-zone-host" x="16" y="64" width="968" height="520" rx="14" fill="var(--s-host-fill)" stroke="var(--s-host-line)" stroke-width="1.5"/>
  <text class="s-txt s-zone" x="32" y="88" fill="var(--s-host-line)">HOST &#183; TRUSTED ZONE</text>

  <!-- KATA microVM -->
  <rect x="40" y="104" width="452" height="430" rx="12" fill="var(--s-vm-fill)" stroke="var(--s-vm-line)" stroke-width="1.6"/>
  <text class="s-txt s-strong" x="56" y="130">KATA microVM</text>
  <text class="s-txt s-small" x="56" y="147">Cloud Hypervisor &#183; KVM/VT-x boundary &#183; untrusted guest</text>

  <!-- gVisor evaluated, not adopted -->
  <text class="s-txt s-small" x="74" y="192">gVisor evaluated &#183; not adopted &#8212; the microVM is the boundary</text>

  <!-- Worker -->
  <rect x="78" y="216" width="376" height="286" rx="8" fill="var(--s-worker-fill)" stroke="var(--s-worker-line)" stroke-width="1.5"/>
  <text class="s-txt s-strong" x="96" y="242">rlms REPL worker</text>
  <text class="s-txt s-small" x="96" y="259">model-authored Python &#183; in-namespace tool injection</text>
  <text class="s-mono s-line" x="96" y="290">&#8226; stateful namespace (self.locals)</text>
  <text class="s-mono s-line" x="96" y="314">&#8226; live creds-free tools &#8212; regex &#183; pandas</text>
  <text class="s-mono s-line" x="96" y="338">&#8226; CapabilityDescriptor stubs:</text>
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <rect x="112" y="350" width="52" height="24" rx="6" fill="none" stroke="var(--s-accent)" stroke-width="1.2"/><text class="s-mono" x="138" y="366" font-size="11.5" text-anchor="middle" fill="var(--s-accent)">pg()</text>
    <rect x="172" y="350" width="70" height="24" rx="6" fill="none" stroke="var(--s-accent)" stroke-width="1.2"/><text class="s-mono" x="207" y="366" font-size="11.5" text-anchor="middle" fill="var(--s-accent)">neo4j()</text>
    <rect x="250" y="350" width="96" height="24" rx="6" fill="none" stroke="var(--s-accent)" stroke-width="1.2"/><text class="s-mono" x="298" y="366" font-size="11.5" text-anchor="middle" fill="var(--s-accent)">llm_query()</text>
  </g>
  <text class="s-txt s-ok" x="96" y="418">&#10003; holds NO database credentials</text>
  <text class="s-txt s-ok" x="96" y="438">&#10003; no route out except vsock</text>
  <text class="s-txt s-small" x="96" y="470">stubs serialize calls &#8594; vsock &#8594; host</text>
  <text class="s-txt s-small" x="96" y="486">(design B: boundary wraps the whole worker)</text>

  <!-- vsock gate -->
  <line x1="492" y1="176" x2="492" y2="470" stroke="var(--s-accent)" stroke-width="3"/>
  <g transform="translate(508,404) rotate(-90)"><text class="s-txt s-gate">VSOCK &#183; ONLY CHANNEL OUT</text></g>

  <!-- host services -->
  <rect x="556" y="150" width="410" height="82" rx="10" fill="var(--s-svc-fill)" stroke="var(--s-svc-line)" stroke-width="1.4"/>
  <text class="s-txt s-strongsm" x="574" y="178">LM handler</text>
  <text class="s-txt s-small" x="574" y="196">llm_query server &#183; sub-LLM fan-out</text>
  <text class="s-mono" x="574" y="216" font-size="10.5" fill="var(--s-soft)">the RLM recursion channel</text>

  <rect x="556" y="266" width="410" height="124" rx="10" fill="var(--s-broker-fill)" stroke="var(--s-svc-line)" stroke-width="1.8"/>
  <text class="s-txt s-strongsm" x="574" y="294">Trusted tool broker</text>
  <text class="s-txt s-small" x="574" y="313">holds Neo4j + Postgres credentials</text>
  <text class="s-txt s-small" x="574" y="331">terminates wire protocol &#183; statement-level denylist</text>
  <text class="s-txt s-small" x="574" y="349">read-only default &#183; row caps &#183; audit log</text>
  <text class="s-txt s-creds" x="574" y="373">&#128273; credentials never enter the guest</text>

  <!-- databases -->
  <g>
    <ellipse cx="624" cy="452" rx="38" ry="9" fill="var(--s-db-fill)" stroke="var(--s-svc-line)" stroke-width="1.2"/>
    <path d="M586,452 L586,492 A38,9 0 0 0 662,492 L662,452" fill="var(--s-db-fill)" stroke="var(--s-svc-line)" stroke-width="1.2"/>
    <text class="s-mono" x="624" y="476" font-size="11" text-anchor="middle">Postgres</text>
  </g>
  <g>
    <ellipse cx="792" cy="452" rx="38" ry="9" fill="var(--s-db-fill)" stroke="var(--s-svc-line)" stroke-width="1.2"/>
    <path d="M754,452 L754,492 A38,9 0 0 0 830,492 L830,452" fill="var(--s-db-fill)" stroke="var(--s-svc-line)" stroke-width="1.2"/>
    <text class="s-mono" x="792" y="476" font-size="11" text-anchor="middle">Neo4j</text>
  </g>

  <!-- channels: vsock -->
  <path class="s-chan" d="M454,300 L556,192" fill="none" stroke="var(--s-accent)" stroke-width="2.4" marker-end="url(#ah-accent)"/>
  <path class="s-chan" d="M454,352 L556,320" fill="none" stroke="var(--s-accent)" stroke-width="2.4" marker-end="url(#ah-accent)"/>
  <text class="s-txt s-chanlbl" x="566" y="146">&#8592; llm_query &#183; 4-byte-len + JSON</text>
  <text class="s-txt s-chanlbl" x="566" y="262">&#8592; DB RPC &#183; run_query / run_cypher</text>

  <!-- broker to DB -->
  <line x1="624" y1="390" x2="624" y2="442" stroke="var(--s-host-line)" stroke-width="2" marker-end="url(#ah-creds)"/>
  <line x1="792" y1="390" x2="792" y2="442" stroke="var(--s-host-line)" stroke-width="2" marker-end="url(#ah-creds)"/>
  <text class="s-txt s-creds" x="708" y="418" text-anchor="middle">real credentials &#183; wire protocol</text>

  <!-- denied egress -->
  <path d="M454,432 L486,432" fill="none" stroke="var(--s-danger)" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="490" y1="426" x2="500" y2="438" stroke="var(--s-danger)" stroke-width="2.4"/>
  <line x1="500" y1="426" x2="490" y2="438" stroke="var(--s-danger)" stroke-width="2.4"/>
  <text class="s-txt s-danger" x="506" y="436">all other egress denied &#8212; host / VMM NIC</text>

  <!-- legend -->
  <rect x="24" y="546" width="16" height="12" rx="2" fill="var(--s-host-fill)" stroke="var(--s-host-line)" stroke-width="1.3"/>
  <text class="s-txt s-leg" x="46" y="556">trusted &#183; creds-safe</text>
  <rect x="196" y="546" width="16" height="12" rx="2" fill="var(--s-vm-fill)" stroke="var(--s-vm-line)" stroke-width="1.3"/>
  <text class="s-txt s-leg" x="218" y="556">untrusted guest</text>
  <line x1="356" y1="552" x2="384" y2="552" stroke="var(--s-accent)" stroke-width="2.6"/>
  <text class="s-txt s-leg" x="390" y="556">vsock connection</text>
  <line x1="536" y1="552" x2="564" y2="552" stroke="var(--s-danger)" stroke-width="2.2" stroke-dasharray="5 4"/>
  <text class="s-txt s-leg" x="570" y="556">denied egress</text>
  <rect x="712" y="546" width="16" height="12" rx="2" fill="var(--s-broker-fill)" stroke="var(--s-svc-line)" stroke-width="1.3"/>
  <text class="s-txt s-leg" x="734" y="556">read-only broker</text>
</svg>
